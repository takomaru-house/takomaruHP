<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[DEV] タコまる — 開発プレビュー</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300;400&family=JetBrains+Mono:wght@400&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg, #f5f1e8); }
    #dev-badge {
      position: fixed; top: 12px; left: 12px; z-index: 9999;
      background: #e07b3b; color: white; font: 11px/1 monospace;
      padding: 4px 8px; border-radius: 4px; letter-spacing: 0.1em;
    }
  </style>
  <!-- React + Babel（CDN） -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="dev-badge">DEV</div>
  <div id="root"></div>

  <!-- JSXを直接読み込み（ファイルを編集してブラウザをリロードするだけで反映） -->
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="artboard-archive.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
